; CC1101 OOK tuning example
;
; Each setting runs for five minutes by default. A test transmitter is expected
; every 30 seconds. Suites advance automatically and comparison environments
; alternate forever.

[platformio]
default_envs = esp32_cc1101_vivint_tuning
src_dir = .

[libraries]
arduinolog = https://github.com/1technophile/Arduino-Log.git#d13cd80aa02c8cf79a33ca24c554ed3331c3679f
arduinojson = ArduinoJson
rtl_433_ESP = symlink://../../../rtl_433_ESP

[env]
platform = espressif32@6.1.0
framework = arduino
board = esp32dev
lib_ldf_mode = chain+
lib_deps =
  ${libraries.arduinolog}
  ${libraries.arduinojson}
  ${libraries.rtl_433_ESP}
monitor_filters = esp32_exception_decoder
monitor_speed = 921600
upload_speed = 921600
build_flags =
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
  '-DONBOARD_LED=2'
  '-DCC1101_OOK_TUNING'
  '-DCC1101_TUNING_SIGNAL_INTERVAL_SECONDS=30'
  '-DRF_CC1101="CC1101"'
  '-DRF_MODULE_GDO0=13'
  '-DRF_MODULE_GDO2=4'

[vivint]
build_flags =
  '-DRF_MODULE_FREQUENCY=345.00'
  '-DCC1101_TUNING_WINDOW_SECONDS=300'
  '-DVIVINT_SEEDS="0016-0357157=e4d8,0016-0345744=1e35,0016-0357170=c283"'
  '-DMINIMUM_SIGNAL_LENGTH=30000'

; Broad first-pass search: 30 settings, approximately 2 hours 30 minutes,
; followed by repeated validation windows on the selected combination.
[env:esp32_cc1101_vivint_tuning]
build_flags =
  ${env.build_flags}
  ${vivint.build_flags}
  '-DCC1101_TUNING_BASE_BANDWIDTH=406.0'
  '-DCC1101_TUNING_BASE_AGCCTRL2=0x03'
  '-DCC1101_TUNING_BASE_AGCCTRL0=0x91'

; Fine second pass: 27 settings, approximately 2 hours 15 minutes.
[env:esp32_cc1101_vivint_refinement]
build_flags =
  ${env.build_flags}
  ${vivint.build_flags}
  '-DCC1101_OOK_TUNING_REFINEMENT'

; Characterizes bandwidth and the remaining AGC bit fields: 31 settings,
; approximately 2 hours 35 minutes.
[env:esp32_cc1101_vivint_extended_tuning]
build_flags =
  ${env.build_flags}
  ${vivint.build_flags}
  '-DCC1101_OOK_TUNING_EXTENDED'

; Direct AGCCTRL2 0x82 versus 0x83 comparison; ten minutes per A/B cycle.
[env:esp32_cc1101_vivint_agc2_compare]
build_flags =
  ${env.build_flags}
  ${vivint.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_AGC2_COMPARE'

; Intermediate recommendation versus extended-suite winner.
[env:esp32_cc1101_vivint_extended_profile_compare]
build_flags =
  ${env.build_flags}
  ${vivint.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_EXTENDED_PROFILE_COMPARE'

; Final original recommendation versus extended-suite winner comparison.
[env:esp32_cc1101_vivint_original_profile_compare]
build_flags =
  ${env.build_flags}
  ${vivint.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_ORIGINAL_PROFILE_COMPARE'

; Generic 433.92 MHz sweep with per-event JSON for comparison against an SDR.
[env:esp32_cc1101_43392_tuning]
build_flags =
  ${env.build_flags}
  '-DCC1101_OOK_TUNING_43392'
  '-DCC1101_TUNING_LOG_EVENTS'
  '-DCC1101_TUNING_WINDOW_SECONDS=60'
  '-DRF_MODULE_FREQUENCY=433.92'
  '-DCC1101_TUNING_BASE_BANDWIDTH=406.0'
  '-DCC1101_TUNING_BASE_AGCCTRL2=0x03'
  '-DCC1101_TUNING_BASE_AGCCTRL0=0x91'

; Two frequencies, three bandwidths, and two AGCCTRL0 values. One 12-minute
; cycle; use the host harness for two or more cycles and reference scoring.
[env:esp32_cc1101_43392_focused_compare]
build_flags =
  ${env.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_43392_FOCUSED_COMPARE'
  '-DCC1101_TUNING_LOG_EVENTS'
  '-DCC1101_TUNING_WINDOW_SECONDS=60'
  '-DRF_MODULE_FREQUENCY=433.92'

; Exact library defaults versus the focused 433.92 MHz result.
[env:esp32_cc1101_43392_default_ab]
build_flags =
  ${env.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_43392_DEFAULT_AB_COMPARE'
  '-DCC1101_TUNING_LOG_EVENTS'
  '-DCC1101_TUNING_WINDOW_SECONDS=60'
  '-DRF_MODULE_FREQUENCY=433.92'

; Full 9-frequency by 4-bandwidth matrix with the selected AGC held fixed.
; One cycle is 36 minutes at 60 seconds per cell.
[env:esp32_cc1101_43392_freq_bw_matrix]
build_flags =
  ${env.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_43392_FREQ_BW_MATRIX'
  '-DCC1101_TUNING_LOG_EVENTS'
  '-DCC1101_TUNING_WINDOW_SECONDS=60'
  '-DRF_MODULE_FREQUENCY=433.92'
