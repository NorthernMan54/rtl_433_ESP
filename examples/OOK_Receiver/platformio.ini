; FSK regression environment using the legacy capture path. WH51 decoder
; diagnostics are enabled to identify preamble, length, checksum, and CRC
; failures without flooding the serial link with every decoder's output.
[env:esp32_cc1101_FSK_no_pretrigger]
extends = env:esp32_cc1101_FSK
build_flags =
  ${env:esp32_cc1101_FSK.build_flags}
  '-DPRETRIGGER_ENABLED=0'
  '-DRTL_VERBOSE=43'

; Regression environment using the legacy capture path. Keep this separate
; from esp32_cc1101 so the production/default pre-trigger behavior stays on.
[env:esp32_cc1101_no_pretrigger]
extends = env:esp32_cc1101
build_flags =
  ${env:esp32_cc1101.build_flags}
  '-DPRETRIGGER_ENABLED=0'

[env:esp32_cc1101_vivint]
board = esp32dev
build_flags = 
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
  '-DONBOARD_LED=2'          ; My ESP32 board had this wiring
; *** rtl_433_ESP Options ***
  '-DRF_MODULE_FREQUENCY=345.00'
;  '-DOOK_MODULATION=false'       ; False is FSK, True is OOK
;  '-DRTL_DEBUG=4'           ; rtl_433 verbose mode
  '-DRTL_VERBOSE=208'         ; Vivint decoder diagnostics
  '-DRAW_SIGNAL_DEBUG=true'   ; display raw received messages
;  '-DMEMORY_DEBUG=true'   ; display memory usage information
  '-DDEMOD_DEBUG=true'  ; display signal debug info
;	 '-DMY_DEVICES=true'		; subset of devices
;  '-DPUBLISH_UNPARSED=true'   ; publish unparsed signal details
;  '-DMINRSSI=-82'
;  '-DSIGNAL_RSSI=true'             ; Display during signal receive
;  '-DOOK_MODULATION=false'       ; False is FSK, True is OOK
; *** Vivint Options ***
; Optional known seeds in TXID=hexseed format. Separate multiple sensors with
; commas. Keep the whole -D flag single-quoted so the value reaches the C
; preprocessor as a string. Omit this flag to use automatic seed discovery.
  '-DVIVINT_SEEDS="0016-0357157=e4d8,0016-0345744=1e35,0016-0357170=c283"'
  '-DCC1101_RX_BANDWIDTH=270.83'
  '-DCC1101_AGCCTRL2=0x83'
  '-DCC1101_AGCCTRL1=0x40'
  '-DCC1101_AGCCTRL0=0x90'
;  '-DOUTPUT_VIVINT_DECODE=0' ; Disable seed status logging
; Seed and seed-discovery output fields are enabled by default. Uncomment to
; omit seed, decode_status, and seed-discovery counters from decoded messages.
;  '-DOUTPUT_VIVINT_DECODE=0'
 '-DMINIMUM_SIGNAL_LENGTH=30000' ; Recommended for Vivint
; *** RF Module Options ***
  '-DRF_CC1101="CC1101"'  ; CC1101 Transceiver Module
;  '-DRF_MODULE_CS=5'      ; pin to be used as chip select
  '-DRF_MODULE_GDO0=13'   ; CC1101 pin GDO0 - Breadboard is 22 versus 13 on soldered
  '-DRF_MODULE_GDO2=4'    ; CC1101 pin GDO2

monitor_port = /dev/cu.usbserial-0001
monitor_speed = 921600
upload_port = /dev/cu.usbserial-0001
upload_speed = 921600

[env:esp32_cc1101_vivint_tuning]
board = esp32dev
build_flags =
  '-DLOG_LEVEL=LOG_LEVEL_TRACE'
  '-DONBOARD_LED=2'          ; My ESP32 board had this wiring
; *** CC1101 OOK tuning options ***
; Runs frequency, bandwidth, AGCCTRL2, and AGCCTRL0 phases hands-off, carries
; each phase winner forward, then leaves the receiver on the final settings.
; The suite aborts after a phase only if every setting had zero decodes.
  '-DCC1101_OOK_TUNING'
  '-DCC1101_TUNING_WINDOW_SECONDS=300'
  '-DCC1101_TUNING_SIGNAL_INTERVAL_SECONDS=30'
  '-DCC1101_TUNING_BASE_BANDWIDTH=406.0'
  '-DCC1101_TUNING_BASE_AGCCTRL2=0x03'
  '-DCC1101_TUNING_BASE_AGCCTRL0=0x91'
; *** rtl_433_ESP Options ***
  '-DRF_MODULE_FREQUENCY=345.00'
;  '-DOOK_MODULATION=false'       ; False is FSK, True is OOK
;  '-DRTL_DEBUG=4'           ; rtl_433 verbose mode
;  '-DRTL_VERBOSE=208'         ; Vivint decoder diagnostics (noisy during tuning)
;  '-DRAW_SIGNAL_DEBUG=true'   ; display raw received messages (noisy during tuning)
;  '-DMEMORY_DEBUG=true'   ; display memory usage information
;  '-DDEMOD_DEBUG=true'  ; display signal debug info (noisy during tuning)
;	 '-DMY_DEVICES=true'		; subset of devices
;  '-DPUBLISH_UNPARSED=true'   ; publish unparsed signal details
;  '-DMINRSSI=-82'
;  '-DSIGNAL_RSSI=true'             ; Display during signal receive
;  '-DOOK_MODULATION=false'       ; False is FSK, True is OOK
; *** Vivint Options ***
; Optional known seeds in TXID=hexseed format. Separate multiple sensors with
; commas. Keep the whole -D flag single-quoted so the value reaches the C
; preprocessor as a string. Omit this flag to use automatic seed discovery.
  '-DVIVINT_SEEDS="0016-0357157=e4d8,0016-0345744=1e35,0016-0357170=c283"'
;  '-DOUTPUT_VIVINT_DECODE=0' ; Disable seed status logging
; Seed and seed-discovery output fields are enabled by default. Uncomment to
; omit seed, decode_status, and seed-discovery counters from decoded messages.
;  '-DOUTPUT_VIVINT_DECODE=0'
 '-DMINIMUM_SIGNAL_LENGTH=30000' ; Recommended for Vivint
; *** RF Module Options ***
  '-DRF_CC1101="CC1101"'  ; CC1101 Transceiver Module
;  '-DRF_MODULE_CS=5'      ; pin to be used as chip select
  '-DRF_MODULE_GDO0=13'   ; CC1101 pin GDO0 - Breadboard is 22 versus 13 on soldered
  '-DRF_MODULE_GDO2=4'    ; CC1101 pin GDO2

monitor_port = /dev/cu.usbserial-0001
monitor_speed = 921600
upload_port = /dev/cu.usbserial-0001
upload_speed = 921600

; Focused second-pass search around the winners from esp32_cc1101_vivint_tuning.
; 27 settings x 300 seconds = 2 hours 15 minutes, followed by repeated
; five-minute validation windows on the final winner.
[env:esp32_cc1101_vivint_refinement]
extends = env:esp32_cc1101_vivint_tuning
build_flags =
  ${env:esp32_cc1101_vivint_tuning.build_flags}
  '-DCC1101_OOK_TUNING_REFINEMENT'

; Follow-up characterization around the long-run candidate. It tests 31
; settings across bandwidth, AGCCTRL2 magnitude/DVGA/LNA fields, AGCCTRL0
; decision-boundary/wait/hysteresis fields, AGCCTRL1 LNA priority, and finally
; a fine frequency grid. At five minutes per setting the search takes about
; 2 hours 35 minutes, then repeats validation windows on the final winner.
[env:esp32_cc1101_vivint_extended_tuning]
extends = env:esp32_cc1101_vivint_tuning
build_flags =
  ${env:esp32_cc1101_vivint_tuning.build_flags}
  '-DCC1101_OOK_TUNING_EXTENDED'

; Direct alternating comparison of the promising AGCCTRL2=0x82 result against
; the current 0x83 candidate. Both profiles use 345.10 MHz, 270.83 kHz,
; AGCCTRL1=0x40, and AGCCTRL0=0x90. Five-minute windows alternate forever,
; with per-window results and cumulative totals for each profile.
[env:esp32_cc1101_vivint_agc2_compare]
extends = env:esp32_cc1101_vivint_tuning
build_flags =
  ${env:esp32_cc1101_vivint_tuning.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_AGC2_COMPARE'

; Alternating complete-profile comparison. "current" is the existing
; 345.10/270.83/0x83/0x40/0x90 recommendation; "extended_winner" is the
; 345.12/325.0/0xC1/0x00/0x61 result assembled by the extended suite.
; Five-minute windows alternate forever and emit cumulative profile totals.
[env:esp32_cc1101_vivint_extended_profile_compare]
extends = env:esp32_cc1101_vivint_tuning
build_flags =
  ${env:esp32_cc1101_vivint_tuning.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_EXTENDED_PROFILE_COMPARE'

; Final comparison of the original documented Vivint recommendation
; (345.00/162.5/0x84/0x40/0xA0) against the new recommendation
; (345.12/325.0/0xC1/0x00/0x61). Five-minute windows alternate forever and
; emit both per-window results and cumulative profile totals.
[env:esp32_cc1101_vivint_original_profile_compare]
extends = env:esp32_cc1101_vivint_tuning
build_flags =
  ${env:esp32_cc1101_vivint_tuning.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_ORIGINAL_PROFILE_COMPARE'

; Alternating 433.92 MHz comparison of supplied rtl_433_ESP CC1101 OOK
; settings against the refined bandwidth/AGC settings. Each profile runs for
; five minutes, and the ten-minute A/B cycle repeats indefinitely.
[env:esp32_cc1101_433_profile_compare]
extends = env:esp32_cc1101
build_unflags =
  '-DDEMOD_DEBUG=true'
build_flags =
  ${env:esp32_cc1101.build_flags}
  '-DCC1101_OOK_PROFILE_COMPARE'
  '-DCC1101_OOK_TUNING'
  '-DCC1101_TUNING_WINDOW_SECONDS=300'
  '-DCC1101_TUNING_SIGNAL_INTERVAL_SECONDS=30'
  '-DRF_MODULE_FREQUENCY=433.92'

