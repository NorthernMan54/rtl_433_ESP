name: Build OOK_Receiver

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build with PlatformIO
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.8"
      - name: Install platformio
        working-directory: example/OOK_Receiver
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Run PlatformIO
        working-directory: example/OOK_Receiver
        run: platformio run

  arduino-cli:
    runs-on: ubuntu-latest
    name: Build Arduino library example
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and dependencies
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "RadioLib@7.7.1"
      - name: Compile minimal example
        run: >-
          arduino-cli compile
          --fqbn esp32:esp32:esp32
          --library .
          --build-property
          'compiler.cpp.extra_flags=-DRF_CC1101 -DRF_MODULE_GDO0=13 -DRF_MODULE_GDO2=4'
          examples/MinimalCompile
