name: Build OOK_Receiver

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: PlatformIO (${{ matrix.environment }})
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32_lilygo
          - esp32_cc1101
          - esp32_cc1101_FSK
          - esp32c3_cdc_cc1101
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install platformio
        working-directory: examples/OOK_Receiver
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Run PlatformIO
        working-directory: examples/OOK_Receiver
        run: platformio run -e ${{ matrix.environment }}

  host-tests:
    runs-on: ubuntu-latest
    name: Host tests and generated files
    steps:
      - uses: actions/checkout@v4
      - name: Test capture state helpers
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc
          test/capture_utils_test.cpp -o /tmp/capture_utils_test
          && /tmp/capture_utils_test
      - name: Check generated decoder registry
        run: python3 tools/check_decoder_registry.py --check

  arduino-cli:
    runs-on: ubuntu-latest
    name: Build Arduino library example
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core and dependencies
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "RadioLib@7.7.1"
      - name: Compile minimal example
        run: >-
          arduino-cli compile
          --fqbn esp32:esp32:esp32
          --library .
          --build-property
          'compiler.cpp.extra_flags=-DRF_CC1101 -DRF_MODULE_GDO0=13 -DRF_MODULE_GDO2=4'
          examples/MinimalCompile
