name: Check or Fix Code Format

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      fix:
        description: Apply clang-format and commit any changes
        required: true
        default: false
        type: boolean

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || !inputs.fix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Check main format
        uses: DoozyX/clang-format-lint-action@v0.6
        with:
          source: "./src ./include/rtl_433_devices.h ./include/log.h"
          exclude: "./src/rtl_433"
          extensions: "h,c,cpp"
          clangFormatVersion: 9
          
  lint-fix:
    if: github.event_name == 'workflow_dispatch' && inputs.fix
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check out clang-format-lint-action v0.6
        uses: actions/checkout@v4
        with:
          repository: DoozyX/clang-format-lint-action
          ref: v0.6
          path: .clang-format-lint-action

      - name: Apply clang-format 9
        shell: bash
        run: |
          formatter="$GITHUB_WORKSPACE/.clang-format-lint-action/clang-format/clang-format9"
          chmod +x "$formatter"
          find ./src \
            -path './src/rtl_433' -prune -o \
            -type f \( -name '*.h' -o -name '*.c' -o -name '*.cpp' \) \
            -print0 | xargs -0 "$formatter" -i
          "$formatter" -i ./include/rtl_433_devices.h ./include/log.h

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Apply clang-format
          file_pattern: "src include/rtl_433_devices.h include/log.h"
